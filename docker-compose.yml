# 4 KMEs = 2 QKD links (link0: relay R0<->R1, link1: relay R1<->R2),
# each link backed by 2 KME instances (start side / end side), matching
# controller.py's LINKS array.
#
# Each container runs two processes (see start.sh):
#   - pqc_tls_proxy.py : terminates real ML-DSA-65 mTLS on PORT (WolfSSL-backed;
#     Python's ssl module can't handle ML-DSA-65 certs) and forwards HTTP to...
#   - app.py            : the original ETSI 014 KME logic, plaintext on
#                          127.0.0.1:FLASK_PORT only.
#
# One CA for every entity (../../pqc_ca, see certs/generate_pqc_certs.py):
#   - CA_FILE       : signs this KME's own cert, and every caller's cert must
#     chain to it. A relay presents its one PQC identity cert as its SAE cert;
#     there is no separate KME-facing cert for it.
#   - ATTACHED_SAE_ID : the only CN allowed on the SAE endpoints (/api/v1/keys/...).
#   - OTHER_KME_CNS   : the only CNs allowed on the KME-to-KME endpoints
#     (/api/v1/kme/...), and the CNs this KME expects from OTHER_KMES, position
#     by position. Being signed by the CA isn't enough on either set of routes.
#
# Certs are NOT bind-mounted: the Dockerfile's `COPY . ...` already bakes
# ./certs into the image (generate_pqc_certs.py writes there by default), so
# re-run that script and `docker compose up --build` whenever certs change.
#
# wolfssl_mldsa.py/.so and the WolfSSL runtime lib live at the qkd_client
# project root, outside this service's build context, so those (unlike
# certs) ARE bind-mounted -- one copy of the PQC crypto code for the whole
# system rather than a vendored copy in the image. Adjust paths accordingly if you move this docker-compose.yml file.

x-kme-common: &kme-common
  build: .
  restart: always
  volumes:
    - ../../wolfssl_mldsa.py:/opt/next-door-key-simulator/wolfssl_mldsa.py:ro
    - ../../libwolfssl_mldsa.so:/opt/next-door-key-simulator/libwolfssl_mldsa.so:ro
    - ../../external/wolfssl/_install_linux_shared/lib:/opt/wolfssl/lib:ro

x-kme-env: &kme-env
  HOST: "0.0.0.0"
  PORT: "8443"
  FLASK_PORT: "18000"
  LD_LIBRARY_PATH: "/opt/wolfssl/lib"
  CA_FILE: "/opt/next-door-key-simulator/certs/ca.crt.pem"
  DEFAULT_KEY_SIZE: "32"
  MAX_KEY_COUNT: "100000"
  MAX_KEYS_PER_REQUEST: "128"
  MAX_KEY_SIZE: "1024"
  MIN_KEY_SIZE: "32"
  KEY_GEN_SEC_TO_GEN: "30"

services:
  kme-link0-start:
    <<: *kme-common
    container_name: kme-link0-start
    environment:
      <<: *kme-env
      KME_ID: "kme-link0-start"
      ATTACHED_SAE_ID: "R0"
      OTHER_KMES: "https://172.23.1.11:8443"
      OTHER_KME_CNS: "kme-link0-end"
      KME_CERT: "/opt/next-door-key-simulator/certs/kme-link0-start.crt.pem"
      KME_KEY: "/opt/next-door-key-simulator/certs/kme-link0-start.key.pem"
    ports:
      - "8010:8443"
    networks:
      kme-network:
        ipv4_address: 172.23.1.10
        aliases: [kme-link0-start]

  kme-link0-end:
    <<: *kme-common
    container_name: kme-link0-end
    environment:
      <<: *kme-env
      KME_ID: "kme-link0-end"
      ATTACHED_SAE_ID: "R1"
      OTHER_KMES: "https://172.23.1.10:8443"
      OTHER_KME_CNS: "kme-link0-start"
      KME_CERT: "/opt/next-door-key-simulator/certs/kme-link0-end.crt.pem"
      KME_KEY: "/opt/next-door-key-simulator/certs/kme-link0-end.key.pem"
    ports:
      - "8011:8443"
    depends_on:
      - kme-link0-start
    networks:
      kme-network:
        ipv4_address: 172.23.1.11
        aliases: [kme-link0-end]

  kme-link1-start:
    <<: *kme-common
    container_name: kme-link1-start
    environment:
      <<: *kme-env
      KME_ID: "kme-link1-start"
      ATTACHED_SAE_ID: "R1"
      OTHER_KMES: "https://172.23.1.13:8443"
      OTHER_KME_CNS: "kme-link1-end"
      KME_CERT: "/opt/next-door-key-simulator/certs/kme-link1-start.crt.pem"
      KME_KEY: "/opt/next-door-key-simulator/certs/kme-link1-start.key.pem"
    ports:
      - "8012:8443"
    networks:
      kme-network:
        ipv4_address: 172.23.1.12
        aliases: [kme-link1-start]

  kme-link1-end:
    <<: *kme-common
    container_name: kme-link1-end
    environment:
      <<: *kme-env
      KME_ID: "kme-link1-end"
      ATTACHED_SAE_ID: "R2"
      OTHER_KMES: "https://172.23.1.12:8443"
      OTHER_KME_CNS: "kme-link1-start"
      KME_CERT: "/opt/next-door-key-simulator/certs/kme-link1-end.crt.pem"
      KME_KEY: "/opt/next-door-key-simulator/certs/kme-link1-end.key.pem"
    ports:
      - "8013:8443"
    depends_on:
      - kme-link1-start
    networks:
      kme-network:
        ipv4_address: 172.23.1.13
        aliases: [kme-link1-end]

networks:
  kme-network:
    driver: bridge
    driver_opts:
      com.docker.network.bridge.name: br-kme
    enable_ipv6: false
    ipam:
      driver: default
      config:
        - subnet: ${IPV4_NETWORK:-172.23.1}.0/24